{% extends 'base.html' %}{% block title %}Masuk{% endblock %}{% block public_content %}<section class="auth-card"><p class="kicker">Akses penelitian</p><h1>Masuk</h1>{% if error %}<p role="alert" class="notice">{{ error }}</p>{% endif %}<form method="post" action="{{ url_for('auth.login') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required><button type="submit" class="button">Masuk</button></form><p>Belum punya akun? <a href="{{ url_for('auth.register_form') }}">Daftar</a></p></section>{% endblock %}
