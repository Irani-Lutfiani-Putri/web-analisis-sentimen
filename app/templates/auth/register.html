{% extends 'base.html' %}{% block title %}Daftar{% endblock %}{% block public_content %}<section class="auth-card"><p class="kicker">Akses penelitian</p><h1>Daftar</h1>{% if error %}<p role="alert" class="notice">{{ error }}</p>{% endif %}<form method="post" action="{{ url_for('auth.register') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label for="full_name">Nama lengkap</label><input id="full_name" name="full_name" autocomplete="name" required maxlength="150"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required><label for="password">Password (minimal 12 karakter)</label><input id="password" name="password" type="password" autocomplete="new-password" minlength="12" required><button type="submit" class="button">Daftar</button></form><p>Sudah punya akun? <a href="{{ url_for('auth.login_hint') }}">Masuk</a></p></section>{% endblock %}
