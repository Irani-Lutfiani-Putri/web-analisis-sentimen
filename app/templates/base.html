<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}Analisis Sentimen{% endblock %} | PT Freeport Indonesia</title><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"></head><body>
{% if current_user.is_authenticated %}<div class="shell"><aside class="sidebar"><p class="brand">ANALISIS SENTIMEN<br><small>PERTAMBANGAN PT FREEPORT INDONESIA</small></p><nav aria-label="Menu utama"><a href="{{ url_for('auth.dashboard') }}">Dashboard</a><a href="{{ url_for('preprocessing.index') }}">Preprocessing</a><a href="{{ url_for('classification.index') }}">Klasifikasi</a><a href="{{ url_for('testing.index') }}">Testing</a></nav><form method="post" action="{{ url_for('auth.logout') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button type="submit" class="text-button">Logout</button></form></aside><main id="main" class="content">{% block content %}{% endblock %}</main></div>{% else %}<header class="public-header"><a href="{{ url_for('pages.landing') }}" class="brand">ANALISIS SENTIMEN KOMENTAR YOUTUBE</a><nav aria-label="Navigasi publik"><a href="{{ url_for('pages.landing') }}#tentang">Tentang</a><a href="{{ url_for('pages.landing') }}#pertambangan">Pertambangan</a><a href="{{ url_for('auth.dashboard') }}">Dashboard</a></nav></header><main id="main" class="public-main">{% block public_content %}{% endblock %}</main>{% endif %}
</body></html>
